<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring Glow -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="12 8" />

  <!-- Center Badge with Glow -->
  <rect x="126" y="126" width="260" height="260" rx="60" fill="url(#badgeGrad)" filter="url(#glow)" />

  <!-- The "龍" (Dragon) Kanji Character -->
  <text x="256" y="310" 
        font-family="'Inter', 'Noto Sans TC', system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="160" 
        fill="#ffffff" 
        text-anchor="middle" 
        dominant-baseline="central"
        style="text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);">龍</text>

  <!-- 100 Badge Pill -->
  <rect x="196" y="405" width="120" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="256" y="425" 
        font-family="'JetBrains Mono', monospace" 
        font-weight="800" 
        font-size="20" 
        fill="#38bdf8" 
        text-anchor="middle" 
        dominant-baseline="central">100 SNT</text>
</svg>
